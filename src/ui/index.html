<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>extensions-viewer</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top">
    <div class="wrap top-in">
      <div class="brand">
        <span class="logo" aria-hidden="true">ev</span>
        <div>
          <strong>extensions-viewer</strong>
          <span id="project" class="muted"></span>
        </div>
      </div>
      <label class="search">
        <span class="sr">검색</span>
        <input id="q" type="search" placeholder="이름·설명·명령 검색" autocomplete="off">
        <kbd aria-hidden="true">/</kbd>
      </label>
      <div class="top-actions">
        <span class="badge" title="설정 파일을 읽기만 합니다">읽기 전용</span>
        <button id="refresh" type="button">새로고침</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section class="summary" aria-live="polite">
      <p id="summary"></p>
      <ul id="notes" class="notes"></ul>
    </section>

    <nav id="tabs" class="tabs" role="tablist" aria-label="종류"></nav>

    <div class="toolbar">
      <div id="filters" class="filters" aria-label="필터"></div>
      <div class="view">
        <div id="viewmode" class="seg" role="group" aria-label="보기"></div>
        <label class="sort"><span class="muted">정렬</span>
          <select id="sort"><option value="name">이름</option><option value="scope">범위</option></select>
        </label>
      </div>
    </div>

    <div class="meta">
      <span id="count" aria-live="polite"></span>
      <button id="reset" type="button" class="link">필터 초기화</button>
    </div>

    <div class="layout">
      <section class="panel" aria-label="목록">
        <div id="state" class="state" role="status"></div>
        <ul id="list" class="list"></ul>
      </section>
      <aside id="detail" class="detail" aria-label="상세" hidden></aside>
    </div>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
